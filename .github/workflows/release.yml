name: Release

# Builds installers when a tag v* is pushed and attaches them to a DRAFT release:
# macOS .dmg (universal: arm64 + x64 in one), Windows setup .exe + .msi, Linux .AppImage, .deb, .rpm, plus SHA256SUMS.
# Nothing here runs until the repository is published and a tag is pushed.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # The draft release is created once, here; the build legs only upload into it (by release id).
  release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Create the draft release
        id: create
        run: |
          id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$TAG" -f name="Nightshift $TAG" -F draft=true -F prerelease=false --jq .id)
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          # one .dmg for every Mac: with two (aarch64 / x64) a person on an M-chip Mac took the x64 one (live run 30.10.2026)
          - os: macos-latest
            target: universal-apple-darwin
            bundles: app,dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # create the draft release and upload assets
    env:
      # macOS signing is OFF unless ALL of these repository secrets are set.
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Linux build dependencies (Tauri 2)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libxdo-dev librsvg2-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev patchelf

      - name: Rust targets (macOS builds both architectures on one runner)
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      # Two build steps, the same except for signing. Signing + notarization is OFF unless ALL six
      # repository secrets are set; secret values live only in the env of the signed step.
      # Names follow https://v2.tauri.app/distribute/sign/macos/ :
      #   APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
      #   APPLE_ID + APPLE_PASSWORD (app-specific password), APPLE_TEAM_ID
      - name: Build and upload (unsigned)
        if: runner.os != 'macOS' || env.HAS_APPLE_SIGNING != 'true'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          releaseId: ${{ needs.release.outputs.release_id }}
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Build, sign, notarize and upload (macOS, secrets set)
        if: runner.os == 'macOS' && env.HAS_APPLE_SIGNING == 'true'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: app
          releaseId: ${{ needs.release.outputs.release_id }}
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Keep the AppImage for the distro smoke test
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage
          path: target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Keep the Windows installer for the smoke test
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-setup
          path: target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  # The Windows installer must install silently and the app must start and stay up; a screenshot of the desktop is
  # kept as an artifact to look at.
  windows-smoke:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-setup
          path: setup
      - name: Install silently, start, stay up 20 s, screenshot
        shell: pwsh
        run: |
          $setup = Get-ChildItem setup\*-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Nightshift", "$env:LOCALAPPDATA\Programs\Nightshift" -Filter *.exe -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          if (-not $exe) { Get-ChildItem $env:LOCALAPPDATA -Depth 2 | Out-String | Write-Host; throw 'installed exe not found' }
          Write-Host "installed: $($exe.FullName)"
          $p = Start-Process $exe.FullName -PassThru
          Start-Sleep 20
          if ($p.HasExited) { throw "the app exited with code $($p.ExitCode)" }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\windows-smoke.png")
          Stop-Process -Id $p.Id
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-smoke
          path: windows-smoke.png
          if-no-files-found: warn

  # The AppImage must start on other distributions: run it under a virtual display for a few
  # seconds; "still running when the timeout hits" (exit 124) counts as started.
  appimage-smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
            install: apt-get update && apt-get install -y --no-install-recommends xvfb libgtk-3-0 libwebkit2gtk-4.1-0 libayatana-appindicator3-1 ca-certificates
          - image: fedora:latest
            install: dnf install -y xorg-x11-server-Xvfb gtk3 webkit2gtk4.1 libappindicator-gtk3
          - image: archlinux:latest
            install: pacman -Syu --noconfirm xorg-server-xvfb gtk3 webkit2gtk-4.1 libayatana-appindicator
          - image: opensuse/tumbleweed:latest
            install: zypper --non-interactive install xvfb-run gtk3 libwebkit2gtk-4_1-0 libayatana-appindicator3-1
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: appimage
          path: appimage
      - name: Install runtime libraries and a virtual display
        run: ${{ matrix.install }}
      - name: Start the AppImage with extract-and-run (no FUSE in containers)
        run: |
          chmod +x appimage/*.AppImage
          set +e
          timeout 20 xvfb-run -a appimage/*.AppImage --appimage-extract-and-run
          code=$?
          echo "exit code: $code"
          [ "$code" -eq 124 ]

  # Waits for the build legs AND the smoke test. The draft is addressed by release id: a draft
  # cannot be found by tag.
  checksums:
    needs: [release, build, appimage-smoke, windows-smoke]
    runs-on: ubuntu-22.04
    permissions:
      contents: write # upload SHA256SUMS into the draft release
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: ${{ needs.release.outputs.release_id }}
    steps:
      - name: Build SHA256SUMS from the draft release assets
        run: |
          mkdir assets && cd assets
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
            --jq '.[] | select(.name | test("\\.(dmg|deb|rpm|AppImage|exe|msi)$")) | "\(.id) \(.name)"' > list.txt
          [ -s list.txt ] || { echo "no installer assets in release $RELEASE_ID" >&2; exit 1; }
          while read -r id name; do
            gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "$name"
          done < list.txt
          rm list.txt
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          curl --proto '=https' --tlsv1.2 -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: text/plain" \
            --data-binary @SHA256SUMS \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=SHA256SUMS"
