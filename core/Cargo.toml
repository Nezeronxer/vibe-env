[package]
name = "nightshift-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
regex = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
sha2 = "0.11.1"

[dev-dependencies]
tempfile = "3"
