[package]
name = "nightshift-app"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
# json! for command results and event payloads (already in the workspace via core)
serde_json = { version = "1", features = ["preserve_order"] }
# derive for the automation file (same version as core)
serde = { version = "1", features = ["derive"] }
# DateTime<Local> for the engine clock and summary_since (already in the workspace through core)
chrono = { version = "0.4", features = ["serde"] }
nightshift-core = { path = "../core" }

[target.'cfg(target_os = "macos")'.dependencies]
# NS_RECORD: WKWebView private switch for drawing a covered window (already in the tree through tauri/wry)
objc2 = "0.6"
